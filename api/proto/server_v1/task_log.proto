syntax = "proto3";

package server_v1;

option go_package = "github.com/rendau/loom/api/server_v1;server_v1";

import "google/api/annotations.proto";

// TaskLogService — чтение логов тасков через control plane (админка).
// Хранятся логи на artifact-сервере (artifact_v1.TaskLogService), control
// plane проксирует чтение — у админки и HTTP-gateway одна точка входа.
service TaskLogService {
  // ReadTaskLog читает лог попытки (по умолчанию с начала; after_seq
  // пропускает уже полученные строки — докачка после обрыва); при
  // follow=true стрим живёт до завершения попытки, отдавая новые строки по
  // мере поступления (live-логи в админке).
  rpc ReadTaskLog(ReadTaskLogRequest) returns (stream ReadTaskLogResponse) {
    option (google.api.http) = {
      get: "/run/{run_id}/task/{task}/attempt/{attempt}/log"
    };
  }
}

// ── Messages ────────────────────────────────────────────

// TaskLogSource — происхождение строки: структурный логгер Runtime,
// перехваченные file descriptor'ы процесса (туда пишут паники Go-рантайма
// и сторонние библиотеки мимо логгера) или сам control plane (исход
// попытки, причина смерти пода).
enum TaskLogSource {
  TASK_LOG_SOURCE_UNSPECIFIED = 0;
  TASK_LOG_SOURCE_LOG = 1;
  TASK_LOG_SOURCE_STDOUT = 2;
  TASK_LOG_SOURCE_STDERR = 3;
  TASK_LOG_SOURCE_SERVER = 4;
}

message TaskLogEntry {
  int64 ts_unix_ms = 1;
  TaskLogSource source = 2;
  string line = 3;
}

// Read

message ReadTaskLogRequest {
  string run_id = 1;
  string task = 2;
  int32 attempt = 3;
  bool follow = 4;
  // Сколько первых строк пропустить (клиент уже получил их до обрыва).
  int64 after_seq = 5;
}

message ReadTaskLogResponse {
  repeated TaskLogEntry entries = 1;
}
