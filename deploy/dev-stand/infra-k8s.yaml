# Инфраструктура dev-стенда в docker-desktop kubernetes: Postgres и
# registry образов дагов. Сами процессы loom (artifact, server, админка)
# запускаются нативно на хосте — их так проще пересобирать и отлаживать.
#
# Оба сервиса торчат наружу фиксированными NodePort'ами: docker-desktop
# публикует их на localhost хоста, и тот же адрес виден с узла — поэтому
# образ дага, запушенный как localhost:30500/..., доступен и docker'у на
# хосте, и kubelet'у, если когда-нибудь понадобится k8s-executor.
#
#   Postgres  localhost:30432   postgres/postgres, базы loom и loom_test
#   Registry  localhost:30500
apiVersion: v1
kind: Namespace
metadata:
  name: loom
---
# ── Postgres ──────────────────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-data
  namespace: loom
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: loom
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:17
          env:
            - { name: POSTGRES_PASSWORD, value: postgres }
            - { name: POSTGRES_DB, value: loom }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: pg-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: loom
spec:
  type: NodePort
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432
---
# ── Registry образов дагов ────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: loom
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: loom
spec:
  replicas: 1
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: registry:2
          ports: [{ containerPort: 5000 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: registry-data }
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: loom
spec:
  type: NodePort
  selector: { app: registry }
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
