syntax = "proto3";

package server_v1;

option go_package = "github.com/rendau/loom/api/server_v1;server_v1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "server_v1/auth.proto"; // UserMain
import "server_v1/dag.proto";  // DagRef

// UserService — управление пользователями админки; доступен только роли
// admin.
service UserService {
  rpc ListUser(google.protobuf.Empty) returns (UserListRep) {
    option (google.api.http) = {
      get: "/user"
    };
  }

  rpc CreateUser(UserCreateReq) returns (UserMain) {
    option (google.api.http) = {
      post: "/user"
      body: "*"
    };
  }

  // UpdateUser меняет заданные поля: пароль, роль, наборы назначенных
  // дагов и проектов.
  rpc UpdateUser(UserUpdateReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/user/{id}"
      body: "*"
    };
  }

  rpc DeleteUser(UserDeleteReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/user/{id}"
    };
  }
}

// ── Messages ────────────────────────────────────────────

message UserListRep {
  repeated UserMain results = 1;
}

message UserCreateReq {
  string username = 1;
  string password = 2;
  string role = 3; // admin | user
  repeated DagRef dags = 5;
  repeated string projects = 6;
  reserved 4; // были dag_names
}

message UserUpdateReq {
  string id = 1;
  optional string password = 2;
  optional string role = 3;
  // set_* = false — набор не меняется; true с пустым списком очищает его.
  repeated DagRef dags = 6;
  bool set_dags = 7;
  repeated string projects = 8;
  bool set_projects = 9;
  reserved 4, 5; // были dag_names / set_dag_names
}

message UserDeleteReq {
  string id = 1;
}
