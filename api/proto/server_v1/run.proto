syntax = "proto3";

package server_v1;

option go_package = "github.com/rendau/loom/api/server_v1;server_v1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";
import "common/common.proto";
import "server_v1/dag.proto";

// RunService — запуски дагов: ручной триггер, журнал ранов, детали рана
// (статусы тасков и попыток).
service RunService {
  // TriggerRun создаёт ран дага: снапшот манифеста и digest образа пиннятся
  // на момент триггера, таски раскручиваются планировщиком.
  rpc TriggerRun(RunTriggerReq) returns (RunTriggerRep) {
    option (google.api.http) = {
      post: "/run"
      body: "*"
    };
  }

  rpc ListRun(RunListReq) returns (RunListRep) {
    option (google.api.http) = {
      get: "/run"
    };
  }

  // GetRun возвращает ран вместе с task instance'ами и их попытками.
  rpc GetRun(RunGetReq) returns (RunGetRep) {
    option (google.api.http) = {
      get: "/run/{id}"
    };
  }

  // RetryTask перезапускает таск завершённого рана: таск возвращается в
  // очередь, его downstream-подграф сбрасывается в pending, ран снова
  // running. На выполняющемся ране недоступен (run_not_finished).
  rpc RetryTask(RunRetryTaskReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/run/{run_id}/task/{task}/retry"
      body: "*"
    };
  }

  // CancelRun принудительно останавливает выполняющийся ран: живые попытки
  // убиваются через executor, незавершённые таски и сам ран получают статус
  // canceled. Уже успешные таски остаются success, поэтому остановленный ран
  // можно доиграть ретраем таска (RetryTask). Завершённый ран останавливать
  // нечего (run_not_running).
  rpc CancelRun(RunCancelReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/run/{id}/cancel"
      body: "*"
    };
  }

  // BackfillRun создаёт раны за прошедший период: по рану на каждый тик
  // cron-расписания дага в [from, to), trigger=backfill, logical_date=тик.
  // Требует расписания у дага; число тиков за вызов ограничено.
  rpc BackfillRun(RunBackfillReq) returns (RunBackfillRep) {
    option (google.api.http) = {
      post: "/run/backfill"
      body: "*"
    };
  }
}

// ── Messages ────────────────────────────────────────────

message RunMain {
  string id = 1;
  string dag_name = 2;
  string image = 3;
  string image_digest = 4;
  string trigger = 5; // manual | schedule | backfill
  string status = 6;  // running | success | failed | canceled
  google.protobuf.Timestamp created_at = 7;
  optional google.protobuf.Timestamp finished_at = 8;
  // «Дата данных» рана: тик расписания у cron/backfill-рана, момент
  // триггера у ручного.
  google.protobuf.Timestamp logical_date = 9;
  // Параметры рана (аналог dagrun.conf); отсутствуют — ран без параметров.
  google.protobuf.Struct params = 10;
}

message TaskInstanceMain {
  string task = 1;
  // pending | queued | starting | running | up_for_retry | success | failed |
  // upstream_failed | canceled
  string status = 2;
  int32 attempt = 3; // номер текущей (последней) попытки; 0 — ещё не стартовала
  optional google.protobuf.Timestamp queued_at = 4;
  optional google.protobuf.Timestamp started_at = 5;
  optional google.protobuf.Timestamp finished_at = 6;
  // Для up_for_retry: когда таск вернётся в очередь.
  optional google.protobuf.Timestamp retry_at = 7;
}

message AttemptMain {
  string task = 1;
  int32 attempt = 2;
  string status = 3; // starting | running | success | failed
  google.protobuf.Timestamp created_at = 4;
  optional google.protobuf.Timestamp started_at = 5;
  optional google.protobuf.Timestamp finished_at = 6;
  optional int32 exit_code = 7;
  string exit_reason = 8; // например OOMKilled, Error, launch_failed
  // Пик памяти по семплам executor'а (docker stats / metrics-server);
  // приблизителен, отсутствует — не измерено.
  optional int64 peak_memory_bytes = 9;
}

// Trigger

message RunTriggerReq {
  string dag_name = 1;
  // Параметры рана (JSON-объект ≤ 64KB), таскам доступны через
  // LOOM_RUN_PARAMS / rt.Params().
  google.protobuf.Struct params = 2;
}

message RunTriggerRep {
  string run_id = 1;
}

// List

message RunListReq {
  common.ListParamsSt list_params = 1;
  optional string dag_name = 2;
  optional string status = 3;
}

message RunListRep {
  common.PaginationInfoSt pagination_info = 1;
  repeated RunMain results = 2;
}

// Get

message RunGetReq {
  string id = 1;
}

// RetryTask

message RunRetryTaskReq {
  string run_id = 1;
  string task = 2;
}

// Cancel

message RunCancelReq {
  string id = 1;
}

// Backfill

message RunBackfillReq {
  string dag_name = 1;
  google.protobuf.Timestamp from = 2; // включительно
  google.protobuf.Timestamp to = 3;   // исключительно
  // Общие параметры всех создаваемых ранов (опционально).
  google.protobuf.Struct params = 4;
}

message RunBackfillRep {
  repeated string run_ids = 1;
}

message RunGetRep {
  RunMain run = 1;
  repeated TaskInstanceMain tasks = 2;
  repeated AttemptMain attempts = 3;
  // Таски из снапшота манифеста рана (структура графа: depends_on).
  // Именно снапшот, а не текущий даг — тот мог перерегистрироваться.
  repeated DagTaskMain manifest_tasks = 4;
}
