syntax = "proto3";

package server_v1;

option go_package = "github.com/rendau/loom/api/server_v1;server_v1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "common/common.proto";

// DagService — управление дагами на control plane.
//
// Даг регистрируется по docker-образу: server запускает контейнер в режиме
// `describe`, валидирует полученный JSON-манифест и сохраняет даг, пиннуя
// его к digest образа на момент регистрации.
service DagService {
  // RegisterDag ставит регистрацию (или перерегистрацию — новая версия
  // образа) дага в очередь и сразу возвращает id записи регистрации:
  // pull + describe выполняются асинхронно, статус — через
  // Get/ListDagRegistration. Имя дага берётся из манифеста.
  rpc RegisterDag(DagRegisterReq) returns (DagRegisterRep) {
    option (google.api.http) = {
      post: "/dag"
      body: "*"
    };
  }

  // ListDagRegistration — записи очереди регистраций, новые первыми:
  // активные (pending|running) и недавно завершённые (старые чистятся по
  // TTL). source=auto — перерегистрация авто-обновления по digest.
  rpc ListDagRegistration(DagRegistrationListReq) returns (DagRegistrationListRep) {
    option (google.api.http) = {
      get: "/dag-registration"
    };
  }

  rpc GetDagRegistration(DagRegistrationGetReq) returns (DagRegistrationMain) {
    option (google.api.http) = {
      get: "/dag-registration/{id}"
    };
  }

  rpc ListDag(DagListReq) returns (DagListRep) {
    option (google.api.http) = {
      get: "/dag"
    };
  }

  rpc GetDag(DagGetReq) returns (DagMain) {
    option (google.api.http) = {
      get: "/dag/{name}"
    };
  }

  // GetDagStats — агрегаты по таскам дага за последние N завершённых
  // ранов: длительности и пики памяти («жирные таски» в админке).
  rpc GetDagStats(DagStatsReq) returns (DagStatsRep) {
    option (google.api.http) = {
      get: "/dag/{name}/stats"
    };
  }

  // SetDagSchedule задаёт cron-расписание и catchup дага. Расписание живёт
  // только на control plane (манифест дага его не содержит); пустая строка
  // снимает расписание.
  rpc SetDagSchedule(DagSetScheduleReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/dag/{name}/schedule"
      body: "*"
    };
  }

  // SetDagPaused ставит даг на паузу / снимает с паузы. Пауза останавливает
  // только запуски по расписанию; ручной триггер работает.
  rpc SetDagPaused(DagSetPausedReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/dag/{name}/paused"
      body: "*"
    };
  }

  // SetDagPool задаёт пул слотов дага: он действует на все его таски (в
  // коде дага пула нет). Пустая строка снимает пул — таски уедут в
  // default. Пул резолвится при триггере рана — смена действует со
  // следующего рана, уже созданные таски не переезжают.
  rpc SetDagPool(DagSetPoolReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/dag/{name}/pool"
      body: "*"
    };
  }

  // SyncDag — принудительное обновление дага из registry: перерегистрация
  // текущего образа дага (pull + describe) прямо сейчас, не дожидаясь тика
  // авто-обновления. Кладётся в ту же очередь, что и RegisterDag, — статус
  // виден через Get/ListDagRegistration (source=manual).
  rpc SyncDag(DagSyncReq) returns (DagSyncRep) {
    option (google.api.http) = {
      post: "/dag/{name}/sync"
      body: "*"
    };
  }

  // SetDagAutoUpdate включает/выключает авто-обновление дага:
  // control plane периодически сверяет digest тега образа с registry и при
  // изменении перерегистрирует даг автоматически.
  rpc SetDagAutoUpdate(DagSetAutoUpdateReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/dag/{name}/auto_update"
      body: "*"
    };
  }

  rpc DeleteDag(DagDeleteReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/dag/{name}"
    };
  }

  // ListTaskResources — оверрайды ресурсов тасков дага из админки.
  // Значения из манифеста (кода дага) — рекомендуемые; непустое поле
  // оверрайда приоритетнее и применяется при launch попытки (подхватывается
  // ретраями без перерегистрации).
  rpc ListTaskResources(TaskResourcesListReq) returns (TaskResourcesListRep) {
    option (google.api.http) = {
      get: "/dag/{name}/task-resources"
    };
  }

  // SetTaskResources задаёт оверрайд ресурсов таска; пустое поле — брать из
  // манифеста. Все поля пустые — оверрайд удаляется.
  rpc SetTaskResources(TaskResourcesSetReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/dag/{name}/task-resources/{task}"
      body: "*"
    };
  }

  // DeleteTaskResources снимает оверрайд таска (возврат к манифесту).
  rpc DeleteTaskResources(TaskResourcesDeleteReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/dag/{name}/task-resources/{task}"
    };
  }

  // PushDagManifest — внутренний вызов describe-Job'а: при
  // регистрации через k8s Job сам отправляет манифест (или ошибку валидации
  // дага) на control plane, вместо передачи через логи пода. describe_id —
  // одноразовый секрет, выданный Job'у в env при создании; ожидающая
  // регистрация забирает манифест по нему.
  rpc PushDagManifest(DagPushManifestReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      post: "/dag/manifest"
      body: "*"
    };
  }
}

// ── Messages ────────────────────────────────────────────

message DagMain {
  string name = 1;
  string image = 2;
  string image_digest = 3;
  string schedule = 4;
  bool paused = 5;
  string sdk_version = 6;
  repeated DagTaskMain tasks = 7;
  google.protobuf.Timestamp created_at = 8;
  optional google.protobuf.Timestamp modified_at = 9;
  // Ближайший запуск по cron-расписанию; отсутствует у дагов без расписания.
  optional google.protobuf.Timestamp next_run_at = 10;
  // Наверстывать пропущенные тики расписания.
  bool catchup = 11;
  // Лимит одновременно выполняющихся ранов; 0 — без лимита.
  int32 max_active_runs = 12;
  // Авто-обновление: poll-синк digest'а тега образа.
  bool auto_update = 13;
  // Последние раны (новые первыми, до 5) — статус-стрип в списке дагов.
  repeated DagLastRun last_runs = 14;
  // Пул слотов дага (задаётся только из админки): действует на все его
  // таски. Пусто — таски уходят в общий пул default.
  string pool = 15;
}

message DagLastRun {
  string run_id = 1;
  string status = 2; // running | success | failed | canceled
}

message DagTaskMain {
  string name = 1;
  repeated DagTaskDepMain depends_on = 2;
  int32 retries = 3;         // ретраев после первой попытки
  int32 retry_delay_sec = 4; // базовая пауза backoff'а; 0 — дефолт сервера
  int32 timeout_sec = 5;     // 0 — без таймаута
  optional DagTaskResources resources = 6;
  reserved 7;                // был pool: пул задаётся на даге, не в коде
  int32 priority = 8;        // больше — раньше из очереди
  // Инъекции секретов в env контейнера таска (имена, не значения).
  repeated DagTaskEnvSecret secrets = 9;
  // Инъекции переменных в env контейнера таска.
  repeated DagTaskEnvVariable variables = 10;
}

message DagTaskEnvSecret {
  string env = 1;    // имя env-переменной в контейнере
  string secret = 2; // имя секрета control plane
}

message DagTaskEnvVariable {
  string env = 1;      // имя env-переменной в контейнере
  string variable = 2; // имя переменной control plane
}

message DagTaskDepMain {
  string task = 1;
  bool streamed = 2;
}

// Ресурсы контейнера попытки (kubernetes quantities: "500m", "256Mi").
message DagTaskResources {
  string cpu_request = 1;
  string cpu_limit = 2;
  string memory_request = 3;
  string memory_limit = 4;
}

// Register

message DagRegisterReq {
  string image = 1;
  // Авто-обновление; отсутствует — сохранить текущее значение
  // (перерегистрация не сбрасывает флаг), у нового дага — false.
  optional bool auto_update = 2;
  // Желаемые настройки нового дага; к уже существующему (перерегистрация)
  // не применяются — его настройками управляют отдельные ручки.
  optional string schedule = 3; // cron; пусто/отсутствует — без расписания
  optional bool catchup = 4;
  optional bool paused = 5; // true — оставить на ручном запуске
  optional string pool = 6; // пул слотов дага; пусто/отсутствует — не задан
}

message DagRegisterRep {
  // Id записи очереди регистраций — для поллинга статуса.
  string registration_id = 1;
}

// Registrations

message DagRegistrationMain {
  string id = 1;
  string image = 2;
  string source = 3; // manual | auto (авто-обновление по digest)
  string status = 4; // pending | running | success | failed
  string error = 5;  // причина failed
  // Имя дага: у manual пусто до успешного describe, у auto известно сразу.
  string dag_name = 6;
  optional string schedule = 7;
  optional bool catchup = 8;
  optional bool paused = 9;
  optional bool auto_update = 10;
  optional string pool = 14;
  google.protobuf.Timestamp created_at = 11;
  optional google.protobuf.Timestamp started_at = 12;
  optional google.protobuf.Timestamp finished_at = 13;
}

message DagRegistrationListReq {
  optional string dag_name = 1;
  // true — только незавершённые (pending | running).
  optional bool active = 2;
  int64 limit = 3; // 0 — дефолт сервера (50)
}

message DagRegistrationListRep {
  repeated DagRegistrationMain results = 1;
}

message DagRegistrationGetReq {
  string id = 1;
}

// List

message DagListReq {
  common.ListParamsSt list_params = 1;
  optional bool paused = 2;
}

message DagListRep {
  common.PaginationInfoSt pagination_info = 1;
  repeated DagMain results = 2;
}

// Get

message DagGetReq {
  string name = 1;
}

// Stats

message DagStatsReq {
  string name = 1;
  // Сколько последних завершённых ранов агрегировать; 0 — дефолт (20).
  int32 last_runs = 2;
}

// DagTaskStat — агрегат по таску: длительность текущих попыток и пик
// памяти (память приблизительна и может отсутствовать у коротких попыток).
message DagTaskStat {
  string task = 1;
  int64 runs = 2; // в скольких ранах таск исполнялся
  double avg_duration_sec = 3;
  double max_duration_sec = 4;
  optional int64 avg_peak_memory_bytes = 5;
  optional int64 max_peak_memory_bytes = 6;
}

message DagStatsRep {
  // Сколько завершённых ранов реально попало в агрегат.
  int64 runs = 1;
  repeated DagTaskStat tasks = 2;
}

// SetSchedule

message DagSetScheduleReq {
  string name = 1;
  // Cron-расписание (5 полей или @daily и т.п.); пустая строка — снять.
  string schedule = 2;
  // Наверстывать пропущенные тики расписания.
  bool catchup = 3;
}

// SetPaused

message DagSetPausedReq {
  string name = 1;
  bool paused = 2;
}

// Pool

message DagSetPoolReq {
  string name = 1;
  string pool = 2; // пусто — снять пул дага
}

// Sync

message DagSyncReq {
  string name = 1;
}

message DagSyncRep {
  // Id записи очереди регистраций — для поллинга статуса.
  string registration_id = 1;
}

// SetAutoUpdate

message DagSetAutoUpdateReq {
  string name = 1;
  bool auto_update = 2;
}

// Delete

message DagDeleteReq {
  string name = 1;
}

// TaskResources (оверрайды из админки)

message TaskResourcesMain {
  string task = 1;
  string cpu_request = 2;
  string cpu_limit = 3;
  string memory_request = 4;
  string memory_limit = 5;
  google.protobuf.Timestamp modified_at = 6;
}

message TaskResourcesListReq {
  string name = 1; // имя дага
}

message TaskResourcesListRep {
  repeated TaskResourcesMain results = 1;
}

message TaskResourcesSetReq {
  string name = 1; // имя дага
  string task = 2;
  string cpu_request = 3;
  string cpu_limit = 4;
  string memory_request = 5;
  string memory_limit = 6;
}

message TaskResourcesDeleteReq {
  string name = 1; // имя дага
  string task = 2;
}

// PushManifest

message DagPushManifestReq {
  string describe_id = 1;
  bytes manifest = 2; // JSON-манифест дага
  string error = 3;   // непустая — describe упал (например, невалидный даг)
}
