syntax = "proto3";

package common;

option go_package = "github.com/rendau/loom/api/common;common";

message ListParamsSt {
  int64 page = 1;
  int64 page_size = 2;
  bool with_total_count = 3;
  bool only_count = 4;
  repeated string sort = 5;
}

message PaginationInfoSt {
  int64 page = 1;
  int64 page_size = 2;
  int64 total_count = 3;
}

message ErrorRep {
  string code = 1;
  string message = 2;
  map<string, string> fields = 3;
}
