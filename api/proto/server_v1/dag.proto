syntax = "proto3";

package server_v1;

option go_package = "github.com/rendau/loom/api/server_v1;server_v1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "common/common.proto";

// DagService — даги-инстансы на control plane.
//
// Даг заводится от шаблона проекта (даг, объявленный в образе), поэтому
// идентификатор составной: проект + имя инстанса. От одного шаблона можно
// завести сколько угодно дагов — различаются они настройками: расписанием,
// пулом, переменными и секретами. Сам образ регистрируется через
// ProjectService.
service DagService {
  // CreateDag заводит даг от шаблона образа. Имя инстанса уникально в
  // пределах проекта; пустое — берётся имя шаблона.
  rpc CreateDag(DagCreateReq) returns (DagMain) {
    option (google.api.http) = {
      post: "/dag"
      body: "*"
    };
  }

  rpc ListDag(DagListReq) returns (DagListRep) {
    option (google.api.http) = {
      get: "/dag"
    };
  }

  rpc GetDag(DagGetReq) returns (DagMain) {
    option (google.api.http) = {
      get: "/dag/{project}/{name}"
    };
  }

  // GetDagStats — агрегаты по таскам дага за последние N завершённых
  // ранов: длительности и пики памяти («жирные таски» в админке).
  rpc GetDagStats(DagStatsReq) returns (DagStatsRep) {
    option (google.api.http) = {
      get: "/dag/{project}/{name}/stats"
    };
  }

  // SetDagSchedule задаёт cron-расписание и catchup дага. Расписание живёт
  // только на control plane (манифест дага его не содержит); пустая строка
  // снимает расписание.
  rpc SetDagSchedule(DagSetScheduleReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/dag/{project}/{name}/schedule"
      body: "*"
    };
  }

  // SetDagPaused ставит даг на паузу / снимает с паузы. Пауза останавливает
  // только запуски по расписанию; ручной триггер работает.
  rpc SetDagPaused(DagSetPausedReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/dag/{project}/{name}/paused"
      body: "*"
    };
  }

  // SetDagPool задаёт пул слотов дага: он действует на все его таски (в
  // коде дага пула нет). Пустая строка снимает пул — таски уедут в
  // default. Пул резолвится при триггере рана — смена действует со
  // следующего рана, уже созданные таски не переезжают.
  rpc SetDagPool(DagSetPoolReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/dag/{project}/{name}/pool"
      body: "*"
    };
  }

  rpc DeleteDag(DagDeleteReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/dag/{project}/{name}"
    };
  }

  // ListTaskResources — оверрайды ресурсов тасков дага из админки.
  // Значения из манифеста (кода дага) — рекомендуемые; непустое поле
  // оверрайда приоритетнее и применяется при launch попытки (подхватывается
  // ретраями без перерегистрации).
  rpc ListTaskResources(TaskResourcesListReq) returns (TaskResourcesListRep) {
    option (google.api.http) = {
      get: "/dag/{project}/{name}/task-resources"
    };
  }

  // SetTaskResources задаёт оверрайд ресурсов таска; пустое поле — брать из
  // манифеста. Все поля пустые — оверрайд удаляется.
  rpc SetTaskResources(TaskResourcesSetReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/dag/{project}/{name}/task-resources/{task}"
      body: "*"
    };
  }

  // DeleteTaskResources снимает оверрайд таска (возврат к манифесту).
  rpc DeleteTaskResources(TaskResourcesDeleteReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/dag/{project}/{name}/task-resources/{task}"
    };
  }
}

// ── Messages ────────────────────────────────────────────

// DagRef — составной идентификатор дага.
message DagRef {
  string project = 1;
  string name = 2;
}

message DagMain {
  string project = 1;
  string name = 2;
  // Имя дага в образе, от которого заведён инстанс.
  string template = 3;
  // Шаблон пропал из образа при последней регистрации: даг работает на
  // последнем известном манифесте.
  bool template_orphaned = 4;
  // Образ проекта и его закреплённый digest.
  string image = 5;
  string image_digest = 6;
  // Авто-обновление образа — свойство проекта, общее для всех его дагов.
  bool auto_update = 7;
  string schedule = 8;
  bool paused = 9;
  // Наверстывать пропущенные тики расписания.
  bool catchup = 10;
  string sdk_version = 11;
  repeated DagTaskMain tasks = 12;
  // Лимит одновременно выполняющихся ранов; 0 — без лимита.
  int32 max_active_runs = 13;
  // Пул слотов дага (задаётся только из админки): действует на все его
  // таски. Пусто — таски уходят в общий пул default.
  string pool = 14;
  // Ближайший запуск по cron-расписанию; отсутствует у дагов без расписания.
  optional google.protobuf.Timestamp next_run_at = 15;
  google.protobuf.Timestamp created_at = 16;
  optional google.protobuf.Timestamp modified_at = 17;
  // Последние раны (новые первыми, до 5) — статус-стрип в списке дагов.
  repeated DagLastRun last_runs = 18;
}

message DagLastRun {
  string run_id = 1;
  string status = 2; // running | success | failed | canceled
}

message DagTaskMain {
  string name = 1;
  repeated DagTaskDepMain depends_on = 2;
  int32 retries = 3;         // ретраев после первой попытки
  int32 retry_delay_sec = 4; // базовая пауза backoff'а; 0 — дефолт сервера
  int32 timeout_sec = 5;     // 0 — без таймаута
  optional DagTaskResources resources = 6;
  reserved 7;                // был pool: пул задаётся на даге, не в коде
  int32 priority = 8;        // больше — раньше из очереди
  // Инъекции секретов в env контейнера таска (имена, не значения).
  repeated DagTaskEnvSecret secrets = 9;
  // Инъекции переменных в env контейнера таска.
  repeated DagTaskEnvVariable variables = 10;
}

message DagTaskEnvSecret {
  string env = 1;    // имя env-переменной в контейнере
  string secret = 2; // имя секрета control plane
  // Описание из кода дага (необязательное): подсказка тому, кто заполняет
  // значение в админке.
  string description = 3;
}

message DagTaskEnvVariable {
  string env = 1;      // имя env-переменной в контейнере
  string variable = 2; // имя переменной control plane
  // Описание из кода дага (необязательное): подсказка тому, кто заполняет
  // значение в админке.
  string description = 3;
}

message DagTaskDepMain {
  string task = 1;
  bool streamed = 2;
}

// Ресурсы контейнера попытки (kubernetes quantities: "500m", "256Mi").
message DagTaskResources {
  string cpu_request = 1;
  string cpu_limit = 2;
  string memory_request = 3;
  string memory_limit = 4;
}

// Create

message DagCreateReq {
  string project = 1;
  // Имя дага в образе (шаблон), от которого заводится инстанс.
  string template = 2;
  // Имя инстанса; пусто — совпадает с именем шаблона.
  string name = 3;
  // Желаемые настройки нового дага.
  optional string schedule = 4; // cron; пусто/отсутствует — без расписания
  optional bool catchup = 5;
  optional bool paused = 6; // true — оставить на ручном запуске
  optional string pool = 7; // пул слотов дага; пусто/отсутствует — не задан
}

// List

message DagListReq {
  common.ListParamsSt list_params = 1;
  optional bool paused = 2;
  // Фильтры: даги проекта / заведённые от конкретного шаблона.
  optional string project = 3;
  optional string template = 4;
}

message DagListRep {
  common.PaginationInfoSt pagination_info = 1;
  repeated DagMain results = 2;
}

// Get

message DagGetReq {
  string project = 1;
  string name = 2;
}

// Stats

message DagStatsReq {
  string project = 1;
  string name = 2;
  // Сколько последних завершённых ранов агрегировать; 0 — дефолт (20).
  int32 last_runs = 3;
}

// DagTaskStat — агрегат по таску: длительность текущих попыток и пик
// памяти (память приблизительна и может отсутствовать у коротких попыток).
message DagTaskStat {
  string task = 1;
  int64 runs = 2; // в скольких ранах таск исполнялся
  double avg_duration_sec = 3;
  double max_duration_sec = 4;
  optional int64 avg_peak_memory_bytes = 5;
  optional int64 max_peak_memory_bytes = 6;
}

message DagStatsRep {
  // Сколько завершённых ранов реально попало в агрегат.
  int64 runs = 1;
  repeated DagTaskStat tasks = 2;
}

// SetSchedule

message DagSetScheduleReq {
  string project = 1;
  string name = 2;
  // Cron-расписание (5 полей или @daily и т.п.); пустая строка — снять.
  string schedule = 3;
  // Наверстывать пропущенные тики расписания.
  bool catchup = 4;
}

// SetPaused

message DagSetPausedReq {
  string project = 1;
  string name = 2;
  bool paused = 3;
}

// Pool

message DagSetPoolReq {
  string project = 1;
  string name = 2;
  string pool = 3; // пусто — снять пул дага
}

// Delete

message DagDeleteReq {
  string project = 1;
  string name = 2;
}

// TaskResources (оверрайды из админки)

message TaskResourcesMain {
  string task = 1;
  string cpu_request = 2;
  string cpu_limit = 3;
  string memory_request = 4;
  string memory_limit = 5;
  google.protobuf.Timestamp modified_at = 6;
}

message TaskResourcesListReq {
  string project = 1;
  string name = 2; // имя дага
}

message TaskResourcesListRep {
  repeated TaskResourcesMain results = 1;
}

message TaskResourcesSetReq {
  string project = 1;
  string name = 2; // имя дага
  string task = 3;
  string cpu_request = 4;
  string cpu_limit = 5;
  string memory_request = 6;
  string memory_limit = 7;
}

message TaskResourcesDeleteReq {
  string project = 1;
  string name = 2; // имя дага
  string task = 3;
}
