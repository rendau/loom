syntax = "proto3";

package server_v1;

option go_package = "github.com/rendau/loom/api/server_v1;server_v1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// SecretService — секреты для env-инъекции в поды тасков.
// Скоуп: dag_name = "" — глобальный, иначе локальный для дага; локальный
// перекрывает глобальный с тем же именем при запуске попытки.
// Списки отдают только метаданные; значение — через GetSecretValue (RBAC).
service SecretService {
  // ListSecret возвращает метаданные секретов (без значений).
  rpc ListSecret(SecretListReq) returns (SecretListRep) {
    option (google.api.http) = {
      get: "/secret"
    };
  }

  // SetSecret создаёт секрет или перезаписывает значение существующего.
  rpc SetSecret(SecretSetReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/secret/{name}"
      body: "*"
    };
  }

  rpc DeleteSecret(SecretDeleteReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/secret/{name}"
    };
  }

  // GetSecretValue возвращает расшифрованное значение секрета («посмотреть
  // по кнопке» в админке). Доступ ограничивается ролями.
  rpc GetSecretValue(SecretGetValueReq) returns (SecretValueRep) {
    option (google.api.http) = {
      get: "/secret/{name}/value"
    };
  }
}

// ── Messages ────────────────────────────────────────────

message SecretMetaMain {
  string name = 1;
  google.protobuf.Timestamp created_at = 2;
  optional google.protobuf.Timestamp modified_at = 3;
  // Скоуп: пусто — глобальный, иначе имя дага.
  string dag_name = 4;
}

message SecretListReq {
  // Отсутствует — все скоупы; "" — только глобальные; имя дага — только его.
  optional string dag_name = 1;
}

message SecretListRep {
  repeated SecretMetaMain results = 1;
}

message SecretSetReq {
  string name = 1;
  string value = 2;
  string dag_name = 3; // пусто — глобальный скоуп
}

message SecretDeleteReq {
  string name = 1;
  string dag_name = 2; // пусто — глобальный скоуп
}

message SecretGetValueReq {
  string name = 1;
  string dag_name = 2; // пусто — глобальный скоуп
}

message SecretValueRep {
  string value = 1;
}
