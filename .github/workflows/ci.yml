name: ci

on:
  push:
    branches: [main]
    # только релизные теги v* (теги модулей api/v*, sdk/v* образы не собирают);
    # паттерн * не захватывает '/'
    tags: ['v*']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [api, sdk, artifact, server, examples]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: go.work.sum
      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...
      # интеграционные тесты server/test скипаются сами: TEST_PG_DSN в CI не задаём
      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test -race ./...

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint

  # Сборка бинарей и docker-образов: на PR — build-only (проверка, что всё
  # собирается), на пуше в main — пуш в ghcr.io с тегом latest,
  # на теге v* — пуш с semver-тегами.
  images:
    runs-on: ubuntu-latest
    needs: [go, admin]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.work
          cache-dependency-path: go.work.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      # Dockerfile'ы рантаймовые: копируют готовый бинарь из cmd/build,
      # server дополнительно — migrations и статику админки из server/admin-ui
      - name: Build binaries
        run: make build
      - name: Build admin SPA
        run: make build-admin

      - name: Login to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (artifact)
        id: meta_artifact
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/artifact
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
      - name: Build/push artifact image
        uses: docker/build-push-action@v6
        with:
          context: artifact
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_artifact.outputs.tags }}
          labels: ${{ steps.meta_artifact.outputs.labels }}

      - name: Docker meta (server)
        id: meta_server
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
      - name: Build/push server image
        uses: docker/build-push-action@v6
        with:
          context: server
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_server.outputs.tags }}
          labels: ${{ steps.meta_server.outputs.labels }}
