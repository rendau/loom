syntax = "proto3";

package server_v1;

option go_package = "github.com/rendau/loom/api/server_v1;server_v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "common/common.proto";

// RunService — запуски дагов: ручной триггер, журнал ранов, детали рана
// (статусы тасков и попыток).
service RunService {
  // TriggerRun создаёт ран дага: снапшот манифеста и digest образа пиннятся
  // на момент триггера, таски раскручиваются планировщиком.
  rpc TriggerRun(RunTriggerReq) returns (RunTriggerRep) {
    option (google.api.http) = {
      post: "/run"
      body: "*"
    };
  }

  rpc ListRun(RunListReq) returns (RunListRep) {
    option (google.api.http) = {
      get: "/run"
    };
  }

  // GetRun возвращает ран вместе с task instance'ами и их попытками.
  rpc GetRun(RunGetReq) returns (RunGetRep) {
    option (google.api.http) = {
      get: "/run/{id}"
    };
  }
}

// ── Messages ────────────────────────────────────────────

message RunMain {
  string id = 1;
  string dag_name = 2;
  string image = 3;
  string image_digest = 4;
  string trigger = 5; // manual | schedule
  string status = 6;  // running | success | failed
  google.protobuf.Timestamp created_at = 7;
  optional google.protobuf.Timestamp finished_at = 8;
}

message TaskInstanceMain {
  string task = 1;
  string status = 2; // pending | queued | starting | running | success | failed | upstream_failed
  int32 attempt = 3; // номер текущей (последней) попытки; 0 — ещё не стартовала
  optional google.protobuf.Timestamp queued_at = 4;
  optional google.protobuf.Timestamp started_at = 5;
  optional google.protobuf.Timestamp finished_at = 6;
}

message AttemptMain {
  string task = 1;
  int32 attempt = 2;
  string status = 3; // starting | running | success | failed
  google.protobuf.Timestamp created_at = 4;
  optional google.protobuf.Timestamp started_at = 5;
  optional google.protobuf.Timestamp finished_at = 6;
  optional int32 exit_code = 7;
  string exit_reason = 8; // например OOMKilled, Error, launch_failed
}

// Trigger

message RunTriggerReq {
  string dag_name = 1;
}

message RunTriggerRep {
  string run_id = 1;
}

// List

message RunListReq {
  common.ListParamsSt list_params = 1;
  optional string dag_name = 2;
  optional string status = 3;
}

message RunListRep {
  common.PaginationInfoSt pagination_info = 1;
  repeated RunMain results = 2;
}

// Get

message RunGetReq {
  string id = 1;
}

message RunGetRep {
  RunMain run = 1;
  repeated TaskInstanceMain tasks = 2;
  repeated AttemptMain attempts = 3;
}
