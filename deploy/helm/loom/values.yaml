# Чарт разворачивает оба plane'а loom в namespace релиза:
#   - server (control plane): gRPC 5052, HTTP API (gateway) 8082, админка 8081,
#     system 3004; поды тасков (Job'ы) создаются в этом же namespace
#   - artifact (data plane): gRPC 5051, system 3003; данные на PVC
#
# Реплики фиксированы = 1 (RWO-PVC под данные artifact и логи server).
# Postgres чарт не разворачивает — DSN приходит секретом (secrets.PG_DSN).

# Образы самого loom публичные — pull-секрет им не нужен; если ставите из
# приватного зеркала, задайте имя dockerconfigjson-секрета здесь.
pull_secret: ''

server:
  image: ghcr.io/rendau/loom/server:latest
  # админка (SPA) и HTTP API (gateway) — разные хосты; API нужен браузеру
  # админки (защищён ADMIN_TOKEN), CORS на gateway включён шаблоном
  domain_admin: loom.example.com
  domain_api: loom-api.example.com
  logs_size: 5Gi
  resource:
    requests:
      memory: 128Mi
    limits:
      memory: 512Mi
  # dockerconfigjson-секрет с кредами registry ОБРАЗОВ ДАГОВ (они приватные
  # и их креды — не креды loom). Одно значение включает оба применения:
  # imagePullSecrets подов тасков и describe-Job'ов (K8S_IMAGE_PULL_SECRET)
  # и digest-чек авто-обновления (решение №30, REGISTRY_AUTH_FILE).
  # Пусто — образы дагов публичные. Создание секрета — deploy/README.md
  dag_registry_secret: ''
  # дополнительные env поверх фиксированных в шаблоне
  # (EXECUTOR/K8S_NAMESPACE/адреса planes/LOG_DIR/HTTP_CORS/ADMIN_API_BASE_URL);
  # сюда же DAG_SYNC_TICK (период авто-обновления дагов, дефолт 5m, 0 — выкл)
  env:
    RUN_TTL: 720h

artifact:
  image: ghcr.io/rendau/loom/artifact:latest
  data_size: 20Gi
  resource:
    requests:
      memory: 128Mi
    limits:
      memory: 512Mi

# Плейсхолдеры — реальные значения кладутся в приватный values-файл
# (helm-репо: values/loom.yaml), см. deploy/README.md:
#   PG_DSN      — postgres control plane
#   AUTH_SECRET — общий секрет attempt-токенов (server + artifact)
#   SECRET_KEY  — парольная фраза шифрования секретов дагов (AES-256-GCM)
#   ADMIN_TOKEN — bearer-токен админского API и админки
secrets:
  PG_DSN: 'postgres://user:pass@host:5432/loom'
  AUTH_SECRET: 'change-me'
  SECRET_KEY: 'change-me'
  ADMIN_TOKEN: 'change-me'
