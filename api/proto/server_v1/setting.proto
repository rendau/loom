syntax = "proto3";

package server_v1;

option go_package = "github.com/rendau/loom/api/server_v1;server_v1";

import "google/api/annotations.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";
import "common/common.proto";

// SettingService — настройки инсталляции в БД (вместо env-конфига):
// TTL ранов, retention по количеству, TTL k8s Job'ов и т.п.
// Скоупы: глобальный (менять может только admin) → проект → даг, иначе
// уточнение для дага (перекрывает глобальное; права — как у переменных
// дага). Имена настроек фиксированы — произвольные сервер отклоняет.
service SettingService {
  // ListSetting возвращает настройки: сохранённые значения по скоупам.
  rpc ListSetting(SettingListReq) returns (SettingListRep) {
    option (google.api.http) = {
      get: "/setting"
    };
  }

  // SetSetting задаёт значение настройки в скоупе.
  rpc SetSetting(SettingSetReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      put: "/setting/{name}"
      body: "*"
    };
  }

  // DeleteSetting удаляет уточнение настройки у дага (возврат к
  // глобальному значению). Глобальные значения не удаляются — только
  // меняются.
  rpc DeleteSetting(SettingDeleteReq) returns (google.protobuf.Empty) {
    option (google.api.http) = {
      delete: "/setting/{name}"
    };
  }
}

// ── Messages ────────────────────────────────────────────

message SettingMain {
  string name = 1;
  string value = 2;
  common.ScopeSt scope = 3;
  google.protobuf.Timestamp modified_at = 4;
}

message SettingListReq {
  // Отсутствует — все скоупы; иначе — только указанный.
  optional common.ScopeSt scope = 1;
}

message SettingListRep {
  repeated SettingMain results = 1;
}

message SettingSetReq {
  string name = 1;
  string value = 2;
  common.ScopeSt scope = 3; // пустой — глобальный скоуп
}

message SettingDeleteReq {
  string name = 1;
  common.ScopeSt scope = 2; // глобальный скоуп не удаляется
}
